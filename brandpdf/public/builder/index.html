<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandPDF Builder</title>
<style>
  :root{
    --bg:#0f1420; --panel:#151b2b; --panel2:#1b2236; --line:#26304a; --line2:#2f3b59;
    --ink:#e8edf7; --mut:#8a96b2; --mut2:#5f6c8c; --accent:#2f7bf6; --accent2:#1C75BC;
    --ok:#2ecc8f; --danger:#ef5e6e; --chip:#202a42;
    --paper:#ffffff; --shadow:0 18px 50px rgba(0,0,0,.45);
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .app{display:grid; grid-template-rows:52px 1fr; height:100vh}

  /* ---- top bar ---- */
  .top{display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.2px}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2f7bf6,#1C75BC);display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
  .brand small{color:var(--mut);font-weight:500}
  .fmt-name{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;min-width:200px}
  .top .spacer{flex:1}
  .sel{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px}
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:#42527a}
  .btn.primary{background:linear-gradient(135deg,#2f7bf6,#1C75BC);border-color:transparent}
  .btn.ghost{background:transparent}
  .zoom{display:flex;align-items:center;gap:6px;color:var(--mut)}
  .zoom button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:14px}

  /* ---- body grid ---- */
  .body{display:grid; grid-template-columns:236px 1fr 296px; min-height:0}
  .rail{background:var(--panel); border-right:1px solid var(--line); overflow:auto}
  .rail.right{border-right:0;border-left:1px solid var(--line)}
  .rail h4{margin:0;padding:14px 16px 8px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut2);font-weight:700}
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 12px 16px}
  .pblock{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 8px;text-align:center;cursor:grab;transition:.12s;user-select:none}
  .pblock:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--panel)}
  .pblock svg{width:20px;height:20px;stroke:#9db4e6;fill:none;stroke-width:1.7;margin-bottom:5px}
  .pblock span{display:block;font-size:11px;color:var(--mut);font-weight:600}
  .hint{padding:0 16px 16px;color:var(--mut2);font-size:11px;line-height:1.5}

  /* ---- canvas ---- */
  .stage{background:
      radial-gradient(circle at 1px 1px, #1a2236 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    overflow:auto; position:relative; padding:34px 20px 80px}
  .paperwrap{margin:0 auto; width:max-content; transform-origin:top center}
  .paper{
    width:210mm; min-height:297mm; background:var(--paper); color:#1A1E2A;
    box-shadow:var(--shadow); border-radius:2px; position:relative; overflow:hidden;
    font-family:'Montserrat','Segoe UI',Arial,sans-serif;
  }
  /* edit shells */
  .blk{position:relative; outline:1.5px dashed transparent; transition:outline-color .1s}
  .blk:hover{outline-color:#bcd2ff}
  .blk.sel{outline:2px solid var(--accent)}
  .blk .tools{position:absolute; top:4px; right:4px; display:none; gap:3px; z-index:5}
  .blk:hover .tools,.blk.sel .tools{display:flex}
  .blk .tools button{width:24px;height:24px;border-radius:6px;border:0;background:#1A1E2Aee;color:#fff;cursor:pointer;font-size:12px;display:grid;place-items:center}
  .blk .tools button:hover{background:var(--accent)}
  .blk .tag{position:absolute; top:4px; left:4px; display:none; background:var(--accent); color:#fff; font-size:9.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:2px 7px; border-radius:5px; z-index:5}
  .blk:hover .tag,.blk.sel .tag{display:block}
  .blk.drag-over{outline:2px solid var(--ok)}
  .dropline{height:2px;background:var(--ok);margin:0 14mm}

  .empty{padding:60px 20px;text-align:center;color:#9aa6c2}

  /* ---- right properties ---- */
  .props{padding:6px 16px 30px}
  .tabs{display:flex;gap:4px;padding:10px 12px 0}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);font-weight:600;font-size:12px;border:1px solid transparent;border-bottom:0}
  .tab.on{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .fld{margin:12px 0}
  .fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .fld input[type=text],.fld textarea,.fld select{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
  .fld textarea{min-height:90px;resize:vertical}
  .row{display:flex;gap:8px;align-items:center}
  .chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;color:var(--ink)}
  .chk input{width:15px;height:15px;accent-color:var(--accent)}
  .color{display:flex;align-items:center;gap:8px}
  .color input[type=color]{width:34px;height:30px;border:1px solid var(--line2);border-radius:7px;background:none;padding:2px;cursor:pointer}
  .seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .seg button{flex:1;background:var(--panel2);color:var(--mut);border:0;padding:7px;cursor:pointer;font-size:12px}
  .seg button.on{background:var(--accent);color:#fff}
  .noselect{color:var(--mut2);text-align:center;padding:36px 16px;font-size:12px;line-height:1.6}
  .delblk{margin-top:18px;width:100%;border:1px solid #5a2a32;background:#2a1820;color:#ff9aa6;border-radius:8px;padding:9px;cursor:pointer;font-weight:600}

  /* ====== DOCUMENT CSS (mirror of brandpdf/blocks.py base_css), scoped to .paper ====== */
  .paper img{max-width:100%}
  .paper .bs-banner{width:100%;display:block}
  .paper .bs-content{color:#1A1E2A;font-size:8.5pt;padding:6mm 14mm}
  .paper table.bs-head{width:100%;border-collapse:collapse;margin-bottom:8mm}
  .paper table.bs-head td{border:0;vertical-align:top;padding:0}
  .paper .bs-title{font-size:23pt;font-weight:800;letter-spacing:1px;line-height:1;color:#1A1E2A}
  .paper .bs-title-ar{font-family:'Cairo','Tajawal',Tahoma,sans-serif;font-size:12pt;font-weight:600;direction:rtl;margin-top:6px}
  .paper table.bs-meta{display:inline-block;text-align:left;border:1px solid #cfe5f6;border-collapse:collapse;font-size:8pt}
  .paper table.bs-meta td{border:1px solid #cfe5f6;padding:3px 7px}
  .paper table.bs-meta td.k{font-weight:600}
  .paper .bs-billto{margin-bottom:6mm}
  .paper .bs-billto .lbl{font-size:7pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
  .paper .bs-billto .name{font-size:10pt;font-weight:700}
  .paper .bs-billto .addr{color:#6b6b6e;font-size:8pt;line-height:1.5}
  .paper table.bs-items{width:100%;border-collapse:collapse;margin-bottom:6mm;table-layout:fixed}
  .paper table.bs-items th,.paper table.bs-items td{word-wrap:break-word}
  .paper table.bs-items thead th{color:#fff;font-weight:600;font-size:7.5pt;padding:6px 8px;text-align:left}
  .paper table.bs-items thead th.num{text-align:right}
  .paper table.bs-items tbody td{padding:6px 8px;border-bottom:1px solid #cfe5f6;vertical-align:top}
  .paper table.bs-items td.num{text-align:right;white-space:nowrap}
  .paper .it-name{font-weight:600}
  .paper .it-desc{color:#6b6b6e;font-size:7pt;line-height:1.4}
  .paper table.bs-tot{width:100%;border-collapse:collapse;font-size:8pt}
  .paper table.bs-tot td{padding:4px 8px;border:0}
  .paper table.bs-tot td.lbl{color:#6b6b6e;text-align:right}
  .paper table.bs-tot td.val{text-align:right;white-space:nowrap;font-weight:600}
  .paper .bs-sec-lbl{font-size:7pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
  .paper .bs-sign-box{display:inline-block;min-width:60mm;text-align:center;border-top:1.5px solid #1A1E2A;padding-top:4px;font-size:8.5pt;font-weight:600;margin-top:14mm}
  .ph-banner{width:100%;height:30mm;display:flex;align-items:center;justify-content:center;color:#ffffffcc;font-size:9pt;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="dot">B</span> BrandPDF <small>Builder</small></div>
    <input class="fmt-name" id="fmtName" value="Quotation - Custom">
    <div class="spacer"></div>
    <div class="zoom"><button onclick="zoom(-.1)">−</button><span id="zoomv">90%</span><button onclick="zoom(.1)">+</button></div>
    <select class="sel" id="sample"><option>Sample: Quotation</option></select>
    <button class="btn ghost" onclick="exportJSON()">⇩ Export</button>
    <button class="btn primary" onclick="save()">✓ Save</button>
  </div>

  <div class="body">
    <!-- LEFT: palette -->
    <div class="rail">
      <h4>Add block</h4>
      <div class="palette" id="palette"></div>
      <div class="hint">Click a block to add it, or drag it onto the page. Drag the ⋮⋮ handle to reorder.</div>
    </div>

    <!-- CENTER: canvas -->
    <div class="stage" id="stage">
      <div class="paperwrap" id="paperwrap">
        <div class="paper" id="paper"></div>
      </div>
    </div>

    <!-- RIGHT: properties -->
    <div class="rail right">
      <div class="tabs">
        <div class="tab on" data-tab="block" onclick="setTab('block')">Block</div>
        <div class="tab" data-tab="brand" onclick="setTab('brand')">Branding</div>
      </div>
      <div class="props" id="propsBlock"></div>
      <div class="props" id="propsBrand" style="display:none"></div>
    </div>
  </div>
</div>

<script>
/* ============================ sample document ============================ */
const SAMPLE = {
  name:"SAL-QTN-2026-00006", transaction_date:"25-06-2026", valid_till:"25-07-2026",
  customer_name:"Hasan Najem", address_display:"Seef 436, Road 3620, Building 925<br>SR360 Tower, Office 112, Bahrain",
  total:"BHD 1,685.000", grand_total:"BHD 1,853.500", discount_amount:"",
  items:[
    {n:"CCTV", q:"1 Service", r:"BHD 0.000", a:"BHD 0.000"},
    {n:"HIKVISION 6 MP ColorVu 3.0 Fixed Bullet Network Camera", q:"38 Pcs", r:"BHD 27.500", a:"BHD 1,045.000", d:"High quality imaging with 8 MP resolution"},
    {n:"HIKVISION 64-ch 2U 4K AcuSense NVR", q:"2 Pcs", r:"BHD 322.500", a:"BHD 645.000"},
    {n:"Ultrastar DC HA340 10TB Enterprise HDD", q:"8 Pcs", r:"BHD 165.000", a:"BHD 1,320.000"},
  ],
  taxes:[{desc:"VAT 10%", amt:"BHD 168.500"}],
  payment_schedule:[
    {t:"Advance", due:"25-06-2026", pct:"50.0", amt:"BHD 926.750"},
    {t:"On Delivery", due:"25-07-2026", pct:"50.0", amt:"BHD 926.750"},
  ],
  terms:"Prices are valid for 30 days. Payment due Net 30. Warranty per manufacturer terms."
};

/* ============================ block registry ============================ */
const ICONS = {
  header_banner:'<rect x="3" y="5" width="18" height="6" rx="1"/><line x1="3" y1="15" x2="14" y2="15"/><line x1="3" y1="19" x2="10" y2="19"/>',
  title:'<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="13" y2="12"/><rect x="15" y="10" width="5" height="5" rx="1"/>',
  customer:'<circle cx="12" cy="8" r="3"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/>',
  items:'<rect x="3" y="4" width="18" height="16" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="20"/>',
  totals:'<line x1="13" y1="6" x2="20" y2="6"/><line x1="13" y1="11" x2="20" y2="11"/><rect x="13" y="15" width="7" height="4" rx="1"/><path d="M4 6h6l-6 7h6"/>',
  payment_schedule:'<rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>',
  terms:'<line x1="5" y1="6" x2="19" y2="6"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="5" y1="14" x2="15" y2="14"/><line x1="5" y1="18" x2="12" y2="18"/>',
  signature:'<path d="M4 17c4 0 5-9 8-9s2 6 4 6 2-3 4-3"/><line x1="3" y1="21" x2="21" y2="21"/>',
  spacer:'<line x1="12" y1="4" x2="12" y2="20"/><polyline points="8,8 12,4 16,8"/><polyline points="8,16 12,20 16,16"/>',
  custom_html:'<polyline points="9,8 5,12 9,16"/><polyline points="15,8 19,12 15,16"/>',
  footer_banner:'<line x1="10" y1="5" x2="21" y2="5"/><line x1="14" y1="9" x2="21" y2="9"/><rect x="3" y="13" width="18" height="6" rx="1"/>',
};
const META = {
  header_banner:{label:"Header"}, title:{label:"Title"}, customer:{label:"Customer"},
  items:{label:"Items"}, totals:{label:"Totals"}, payment_schedule:{label:"Payment"},
  terms:{label:"Terms"}, signature:{label:"Signature"}, spacer:{label:"Spacer"},
  custom_html:{label:"Custom"}, footer_banner:{label:"Footer"},
};
const DEFAULTS = {
  header_banner:()=>({}),
  title:()=>({text:"QUOTATION", showArabic:true, arabic:"عرض سعر", meta:{name:true,date:true,valid_till:true}, align:"split"}),
  customer:()=>({heading:"Quotation To"}),
  items:()=>({cols:{qty:true,rate:true,amount:true,desc:true}, zebra:true, headerColor:"primary"}),
  totals:()=>({grandColor:"primary"}),
  payment_schedule:()=>({}),
  terms:()=>({heading:"Terms & Conditions"}),
  signature:()=>({label:"Authorized Signature"}),
  spacer:()=>({height:8}),
  custom_html:()=>({html:"<p style='font-size:8pt'>Bank: BSTC W.L.L · IBAN BH00 XXXX · Thank you for your business.</p>"}),
  footer_banner:()=>({}),
};

/* ============================ state ============================ */
let selId=null, tab="block", scale=.9, idc=1;
function blk(type){ return {id:"b"+(idc++), type, settings:DEFAULTS[type]()}; }
let state = {
  branding:{ primary:"#1C75BC", navy:"#1A1E2A", font:"Montserrat", header_image:"", footer_image:"" },
  blocks:[
    blk("header_banner"), blk("title"), blk("customer"),
    blk("items"), blk("totals"), blk("payment_schedule"), blk("terms"), blk("footer_banner"),
  ],
};
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ============================ document renderers (mirror blocks.py) ====== */
const R = {
  header_banner:(s,b)=> b.header_image
      ? `<img class="bs-banner" src="${esc(b.header_image)}">`
      : `<div class="ph-banner" style="background:${b.primary}">Header banner</div>`,
  footer_banner:(s,b)=> b.footer_image
      ? `<img class="bs-banner" src="${esc(b.footer_image)}">`
      : `<div class="ph-banner" style="background:${b.navy}">Footer banner</div>`,
  title:(s,b)=>{
    const m=[]; if(s.meta.name)m.push(["Quotation No",SAMPLE.name]);
    if(s.meta.date)m.push(["Date",SAMPLE.transaction_date]);
    if(s.meta.valid_till)m.push(["Valid Till",SAMPLE.valid_till]);
    const rows=m.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");
    const left=`<div class="bs-title" style="color:${b.navy}">${esc(s.text)}</div>`+
      (s.showArabic?`<div class="bs-title-ar" style="color:${b.primary}">${esc(s.arabic)}</div>`:"");
    const meta=`<table class="bs-meta">${rows}</table>`;
    if(s.align==="center") return `<div style="text-align:center">${left}</div>`;
    return `<table class="bs-head"><tr><td style="text-align:left">${left}</td><td style="text-align:right">${meta}</td></tr></table>`;
  },
  customer:(s,b)=>`<div class="bs-billto"><div class="lbl" style="color:${b.primary}">${esc(s.heading)}</div>`+
      `<div class="name">${esc(SAMPLE.customer_name)}</div><div class="addr">${SAMPLE.address_display}</div></div>`,
  items:(s,b)=>{
    const cols=[["#","num"],["Item &amp; Description",""]];
    if(s.cols.qty)cols.push(["Qty","num"]); if(s.cols.rate)cols.push(["Rate","num"]); if(s.cols.amount)cols.push(["Amount","num"]);
    const hc = s.headerColor==="navy"?b.navy:b.primary;
    const th=cols.map(c=>`<th class="${c[1]}" style="background:${hc}">${c[0]}</th>`).join("");
    const rows=SAMPLE.items.map((it,i)=>{
      let tds=`<td class="num">${i+1}</td><td><div class="it-name">${esc(it.n)}</div>`+
        (s.cols.desc&&it.d?`<div class="it-desc">${esc(it.d)}</div>`:"")+`</td>`;
      if(s.cols.qty)tds+=`<td class="num">${esc(it.q)}</td>`;
      if(s.cols.rate)tds+=`<td class="num">${esc(it.r)}</td>`;
      if(s.cols.amount)tds+=`<td class="num">${esc(it.a)}</td>`;
      const z = s.zebra&&i%2 ? ' style="background:#eef6fc"' : '';
      return `<tr${z}>${tds}</tr>`;
    }).join("");
    return `<table class="bs-items"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;
  },
  totals:(s,b)=>{
    const gc = s.grandColor==="navy"?b.navy:b.primary;
    let ln=`<tr><td class="lbl">Subtotal</td><td class="val">${esc(SAMPLE.total)}</td></tr>`;
    SAMPLE.taxes.forEach(t=>ln+=`<tr><td class="lbl">${esc(t.desc)}</td><td class="val">${esc(t.amt)}</td></tr>`);
    ln+=`<tr><td style="background:${gc};color:#fff;font-weight:700;font-size:10pt;text-align:right;padding:6px 8px">Grand Total</td>`+
        `<td style="background:${gc};color:#fff;font-weight:700;font-size:10pt;text-align:right;padding:6px 8px">${esc(SAMPLE.grand_total)}</td></tr>`;
    return `<table style="width:100%;border-collapse:collapse"><tr><td></td><td style="width:82mm"><table class="bs-tot">${ln}</table></td></tr></table>`;
  },
  payment_schedule:(s,b)=>{
    const rows=SAMPLE.payment_schedule.map((p,i)=>`<tr${i%2?' style="background:#eef6fc"':''}><td class="num">${i+1}</td><td><div class="it-name">${esc(p.t)}</div></td><td class="num">${esc(p.due)}</td><td class="num">${esc(p.pct)}</td><td class="num">${esc(p.amt)}</td></tr>`).join("");
    return `<div style="margin-top:6mm"><div class="bs-sec-lbl" style="color:${b.primary}">Payment Schedule</div>`+
      `<table class="bs-items"><thead><tr><th class="num" style="background:${b.primary}">#</th><th style="background:${b.primary}">Payment Term</th><th class="num" style="background:${b.primary}">Due Date</th><th class="num" style="background:${b.primary}">Portion %</th><th class="num" style="background:${b.primary}">Amount</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  },
  terms:(s,b)=>`<div style="margin-top:7mm;font-size:7.5pt;color:#6b6b6e;line-height:1.5"><div class="bs-sec-lbl" style="color:${b.primary}">${esc(s.heading)}</div>${esc(SAMPLE.terms)}</div>`,
  signature:(s,b)=>`<table style="width:100%;border-collapse:collapse"><tr><td></td><td style="width:60mm;text-align:center"><div class="bs-sign-box">${esc(s.label)}</div></td></tr></table>`,
  spacer:(s)=>`<div style="height:${(+s.height||8)}mm"></div>`,
  custom_html:(s)=> s.html||"",
};
const BANNER=new Set(["header_banner","footer_banner"]);

/* ============================ canvas render ============================ */
function render(){
  const b=state.branding, paper=document.getElementById("paper");
  paper.style.fontFamily=`'${b.font}','Segoe UI',Arial,sans-serif`;
  let html="", contentOpen=false;
  const open=()=>{ if(!contentOpen){html+=`<div class="bs-content">`;contentOpen=true;} };
  const close=()=>{ if(contentOpen){html+=`</div>`;contentOpen=false;} };
  if(!state.blocks.length){ paper.innerHTML=`<div class="empty">Empty page — add blocks from the left.</div>`; return; }
  state.blocks.forEach(bl=>{
    const inner=(R[bl.type]||(()=>"")) (bl.settings,b);
    const shell=`<div class="blk ${bl.id===selId?'sel':''}" data-id="${bl.id}" draggable="false">
        <span class="tag">${META[bl.type].label}</span>
        <div class="tools">
          <button title="Move up" onmousedown="event.stopPropagation()" onclick="move('${bl.id}',-1)">↑</button>
          <button title="Move down" onmousedown="event.stopPropagation()" onclick="move('${bl.id}',1)">↓</button>
          <button class="grab" title="Drag to reorder" data-grab="${bl.id}">⋮⋮</button>
          <button title="Delete" onclick="del('${bl.id}')">🗑</button>
        </div>${inner}</div>`;
    if(BANNER.has(bl.type)){ close(); html+=shell; } else { open(); html+=shell; }
  });
  close();
  paper.innerHTML=html;
  // select on click
  paper.querySelectorAll(".blk").forEach(el=>{
    el.addEventListener("click",e=>{ if(e.target.closest(".tools"))return; select(el.dataset.id); });
  });
  wireDrag();
}

/* ============================ interactions ============================ */
function addBlock(type){ const nb=blk(type); const i=selIndex(); if(i>=0)state.blocks.splice(i+1,0,nb); else state.blocks.push(nb); selId=nb.id; render(); renderProps(); }
function selIndex(){ return state.blocks.findIndex(x=>x.id===selId); }
function select(id){ selId=id; tab="block"; setTab("block",true); render(); renderProps(); }
function del(id){ state.blocks=state.blocks.filter(x=>x.id!==id); if(selId===id)selId=null; render(); renderProps(); }
function move(id,dir){ const i=state.blocks.findIndex(x=>x.id===id); const j=i+dir; if(j<0||j>=state.blocks.length)return; [state.blocks[i],state.blocks[j]]=[state.blocks[j],state.blocks[i]]; render(); }

let dragId=null;
function wireDrag(){
  document.querySelectorAll("[data-grab]").forEach(h=>{
    h.onmousedown=(e)=>{ e.preventDefault(); dragId=h.dataset.grab; const blkEl=h.closest(".blk"); blkEl.style.opacity=".5"; document.body.style.cursor="grabbing"; };
  });
  const paper=document.getElementById("paper");
  paper.onmousemove=(e)=>{ if(!dragId)return; const over=e.target.closest(".blk"); paper.querySelectorAll(".blk").forEach(x=>x.classList.remove("drag-over")); if(over&&over.dataset.id!==dragId)over.classList.add("drag-over"); };
  document.onmouseup=(e)=>{
    if(!dragId)return;
    const over=e.target.closest&&e.target.closest(".blk");
    if(over&&over.dataset.id!==dragId){
      const from=state.blocks.findIndex(x=>x.id===dragId), to=state.blocks.findIndex(x=>x.id===over.dataset.id);
      const [m]=state.blocks.splice(from,1); state.blocks.splice(to,0,m);
    }
    dragId=null; document.body.style.cursor=""; render();
  };
}

/* palette drag-to-add */
function buildPalette(){
  const p=document.getElementById("palette");
  p.innerHTML=Object.keys(META).map(t=>
    `<div class="pblock" onclick="addBlock('${t}')" title="Add ${META[t].label}">
       <svg viewBox="0 0 24 24">${ICONS[t]}</svg><span>${META[t].label}</span></div>`).join("");
}

/* ============================ properties panel ============================ */
function setTab(t,silent){ tab=t; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));
  document.getElementById("propsBlock").style.display=t==="block"?"":"none";
  document.getElementById("propsBrand").style.display=t==="brand"?"":"none";
  if(!silent){ if(t==="brand")renderBrand(); else renderProps(); } }

function setS(k,v){ const b=state.blocks[selIndex()]; if(!b)return; const path=k.split("."); let o=b.settings; for(let i=0;i<path.length-1;i++)o=o[path[i]]; o[path[path.length-1]]=v; render(); }
function fldText(lbl,k,val){return `<div class="fld"><label>${lbl}</label><input type="text" value="${esc(val)}" oninput="setS('${k}',this.value)"></div>`;}
function fldArea(lbl,k,val){return `<div class="fld"><label>${lbl}</label><textarea oninput="setS('${k}',this.value)">${esc(val)}</textarea></div>`;}
function fldChk(lbl,k,on){return `<label class="chk"><input type="checkbox" ${on?"checked":""} onchange="setS('${k}',this.checked)"> ${lbl}</label>`;}
function fldSeg(lbl,k,val,opts){return `<div class="fld"><label>${lbl}</label><div class="seg">`+opts.map(o=>`<button class="${val===o[0]?'on':''}" onclick="setS('${k}','${o[0]}');renderProps()">${o[1]}</button>`).join("")+`</div></div>`;}

function renderProps(){
  const host=document.getElementById("propsBlock");
  const b=state.blocks[selIndex()];
  if(!b){ host.innerHTML=`<div class="noselect">Select a block on the page to edit it,<br>or add one from the left.</div>`; return; }
  const s=b.settings; let h=`<div style="font-weight:700;margin:14px 2px 2px;font-size:13px">${META[b.type].label} block</div>`;
  if(b.type==="title"){
    h+=fldText("Title text","text",s.text);
    h+=fldChk("Show Arabic subtitle","showArabic",s.showArabic);
    if(s.showArabic)h+=fldText("Arabic subtitle","arabic",s.arabic);
    h+=fldSeg("Layout","align",s.align,[["split","Title + Info box"],["center","Centered"]]);
    h+=`<div class="fld"><label>Info box fields</label>`+
       fldChk("Quotation No","meta.name",s.meta.name)+fldChk("Date","meta.date",s.meta.date)+fldChk("Valid Till","meta.valid_till",s.meta.valid_till)+`</div>`;
  } else if(b.type==="customer"){ h+=fldText("Heading","heading",s.heading);
  } else if(b.type==="items"){
    h+=`<div class="fld"><label>Columns</label>`+fldChk("Description line","cols.desc",s.cols.desc)+fldChk("Qty","cols.qty",s.cols.qty)+fldChk("Rate","cols.rate",s.cols.rate)+fldChk("Amount","cols.amount",s.cols.amount)+`</div>`;
    h+=fldChk("Zebra striped rows","zebra",s.zebra);
    h+=fldSeg("Header color","headerColor",s.headerColor,[["primary","Primary"],["navy","Navy"]]);
  } else if(b.type==="totals"){ h+=fldSeg("Grand-total color","grandColor",s.grandColor,[["primary","Primary"],["navy","Navy"]]);
  } else if(b.type==="terms"){ h+=fldText("Heading","heading",s.heading);
  } else if(b.type==="signature"){ h+=fldText("Signature label","label",s.label);
  } else if(b.type==="spacer"){ h+=fldText("Height (mm)","height",s.height);
  } else if(b.type==="custom_html"){ h+=fldArea("Custom HTML","html",s.html);
  } else if(b.type==="header_banner"||b.type==="footer_banner"){ h+=`<div class="noselect">This uses your banner image from the <b>Branding</b> tab. If empty, a colored placeholder is shown.</div>`;
  }
  h+=`<button class="delblk" onclick="del('${b.id}')">Delete this block</button>`;
  host.innerHTML=h;
}
function setB(k,v){ state.branding[k]=v; render(); }
function renderBrand(){
  const b=state.branding;
  document.getElementById("propsBrand").innerHTML=
    `<div style="font-weight:700;margin:14px 2px 2px;font-size:13px">Branding</div>`+
    `<div class="fld"><label>Primary color</label><div class="color"><input type="color" value="${b.primary}" oninput="setB('primary',this.value)"><input type="text" value="${esc(b.primary)}" oninput="setB('primary',this.value)"></div></div>`+
    `<div class="fld"><label>Secondary / navy</label><div class="color"><input type="color" value="${b.navy}" oninput="setB('navy',this.value)"><input type="text" value="${esc(b.navy)}" oninput="setB('navy',this.value)"></div></div>`+
    `<div class="fld"><label>Font</label><select onchange="setB('font',this.value)">`+["Montserrat","Cairo","Arial","Tahoma"].map(f=>`<option ${b.font===f?'selected':''}>${f}</option>`).join("")+`</select></div>`+
    fldTextB("Header image URL","header_image",b.header_image)+
    fldTextB("Footer image URL","footer_image",b.footer_image)+
    `<div class="hint" style="padding:6px 0 0">In ERPNext these come from BrandPDF Settings (logo upload). Paste a /files/... path to preview here.</div>`;
}
function fldTextB(lbl,k,val){return `<div class="fld"><label>${lbl}</label><input type="text" value="${esc(val)}" oninput="setB('${k}',this.value)"></div>`;}

/* ============================ misc ============================ */
function zoom(d){ scale=Math.min(1.6,Math.max(.4,scale+d)); document.getElementById("paperwrap").style.transform=`scale(${scale})`; document.getElementById("zoomv").textContent=Math.round(scale*100)+"%"; }
function definition(){ return { name:document.getElementById("fmtName").value, branding:state.branding, blocks:state.blocks.map(b=>({type:b.type,settings:b.settings})) }; }
function exportJSON(){ const blob=new Blob([JSON.stringify(definition(),null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(document.getElementById("fmtName").value||"format")+".json"; a.click(); }
function save(){
  const def=definition();
  if(window.frappe&&frappe.call){ frappe.call({method:"brandpdf.api.save_format",args:{definition:def},callback:()=>frappe.show_alert({message:"Format saved",indicator:"green"})}); }
  else { console.log("DEFINITION",def); alert("Saved (demo). Definition logged to console."); }
}

/* boot */
buildPalette(); render(); renderProps(); renderBrand(); zoom(0);
</script>
</body>
</html>
