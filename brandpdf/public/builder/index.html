<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandPDF Builder</title>
<style>
  :root{--bg:#0f1420;--panel:#151b2b;--panel2:#1b2236;--line:#26304a;--line2:#2f3b59;--ink:#e8edf7;--mut:#8a96b2;--mut2:#5f6c8c;--accent:#2f7bf6;--ok:#2ecc8f;--paper:#fff;--shadow:0 18px 50px rgba(0,0,0,.45)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','Segoe UI',system-ui,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:grid;grid-template-rows:52px 1fr;height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2f7bf6,#1C75BC);display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
  .brand small{color:var(--mut);font-weight:500}
  .fmt-name{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;min-width:190px}
  .top .spacer{flex:1}
  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:#42527a}
  .btn.primary{background:linear-gradient(135deg,#2f7bf6,#1C75BC);border-color:transparent}
  .btn.ghost{background:transparent}
  .zoom{display:flex;align-items:center;gap:6px;color:var(--mut)}
  .zoom button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:14px}
  .body{display:grid;grid-template-columns:222px 1fr 300px;min-height:0}
  .rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto}
  .rail.right{border-right:0;border-left:1px solid var(--line)}
  .rail h4{margin:0;padding:14px 16px 4px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut2);font-weight:700}
  #palette{padding:4px 12px 16px}
  .pgrp{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut2);font-weight:700;margin:12px 4px 6px}
  .prow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pblock{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center;cursor:pointer;transition:.12s;user-select:none}
  .pblock:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--panel)}
  .pblock svg{width:19px;height:19px;stroke:#9db4e6;fill:none;stroke-width:1.7;margin-bottom:4px}
  .pblock span{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
  .hint{padding:8px 16px 16px;color:var(--mut2);font-size:11px;line-height:1.5}
  .stage{background:radial-gradient(circle at 1px 1px,#1a2236 1px,transparent 0) 0 0/22px 22px,var(--bg);overflow:auto;position:relative;padding:34px 30px 120px}
  .paperwrap{margin:0 auto;width:max-content;transform-origin:top center}
  .paper{width:210mm;height:297mm;background:var(--paper);color:#1A1E2A;box-shadow:var(--shadow);position:relative;overflow:hidden;font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-size:8.5pt;
    background-image:linear-gradient(#0000000a 1px,transparent 1px),linear-gradient(90deg,#0000000a 1px,transparent 1px);background-size:5mm 5mm}
  .blk{position:absolute;outline:1px dashed transparent;cursor:move}
  .blk:hover{outline-color:#bcd2ff}
  .blk.sel{outline:2px solid var(--accent);z-index:50}
  .blk .tools{position:absolute;top:-1px;right:-1px;display:none;gap:3px;z-index:6;transform:translateY(-100%)}
  .blk:hover .tools,.blk.sel .tools{display:flex}
  .blk .tools button{width:22px;height:22px;border-radius:5px;border:0;background:#1A1E2Aee;color:#fff;cursor:pointer;font-size:11px}
  .blk .tools button:hover{background:var(--accent)}
  .blk .tag{position:absolute;top:-1px;left:-1px;display:none;background:var(--accent);color:#fff;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:4px;z-index:6;transform:translateY(-100%)}
  .blk:hover .tag,.blk.sel .tag{display:block}
  .blk [contenteditable]:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .rh{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--accent);border-radius:2px;z-index:7}
  .rh.e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}
  .rh.s{bottom:-6px;left:calc(50% - 5px);cursor:ns-resize}
  .rh.se{right:-6px;bottom:-6px;cursor:nwse-resize}
  .tabs{display:flex;gap:4px;padding:10px 12px 0}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);font-weight:600;font-size:12px;border:1px solid transparent;border-bottom:0}
  .tab.on{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .props{padding:6px 16px 50px}
  .ptitle{font-weight:700;margin:12px 2px 2px;font-size:13px}
  .fld{margin:10px 0}
  .fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .fld input[type=text],.fld textarea,.fld select{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit}
  .fld textarea{min-height:70px;resize:vertical}
  .row2{display:flex;gap:8px}.row2>*{flex:1;margin:10px 0}
  .chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px}
  .chk input{width:15px;height:15px;accent-color:var(--accent)}
  .color{display:flex;align-items:center;gap:8px}
  .color input[type=color]{width:34px;height:30px;border:1px solid var(--line2);border-radius:7px;background:none;padding:2px;cursor:pointer}
  .seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .seg button{flex:1;background:var(--panel2);color:var(--mut);border:0;padding:7px 4px;cursor:pointer;font-size:11.5px}
  .seg button.on{background:var(--accent);color:#fff}
  .stygrp{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
  .styhead{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut2);font-weight:700;margin:8px 2px}
  .tablebtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  .tablebtns button{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px;cursor:pointer;font-size:12px}
  .noselect{color:var(--mut2);text-align:center;padding:36px 16px;font-size:12px;line-height:1.6}
  .delblk{margin-top:16px;width:100%;border:1px solid #5a2a32;background:#2a1820;color:#ff9aa6;border-radius:8px;padding:9px;cursor:pointer;font-weight:600}
  /* document CSS (scoped to .paper) */
  .paper img{max-width:100%}
  .paper .bs-banner{width:100%;display:block}
  .paper .bs-title{font-size:23pt;font-weight:800;letter-spacing:1px;line-height:1;color:#1A1E2A}
  .paper .bs-title-ar{font-family:'Cairo','Tajawal',Tahoma,sans-serif;font-size:12pt;font-weight:600;direction:rtl;margin-top:6px}
  .paper table.bs-head{width:100%;border-collapse:collapse}
  .paper table.bs-head td{border:0;vertical-align:top;padding:0}
  .paper table.bs-meta{display:inline-block;text-align:left;border:1px solid #cfe5f6;border-collapse:collapse;font-size:8pt}
  .paper table.bs-meta td{border:1px solid #cfe5f6;padding:3px 7px}
  .paper table.bs-meta td.k{font-weight:600}
  .paper .bs-billto .lbl{font-size:7pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
  .paper .bs-billto .name{font-size:10pt;font-weight:700}
  .paper .bs-billto .addr{color:#6b6b6e;font-size:8pt;line-height:1.5}
  .paper table.bs-items{width:100%;border-collapse:collapse;table-layout:fixed}
  .paper table.bs-items th,.paper table.bs-items td{word-wrap:break-word}
  .paper table.bs-items thead th{color:#fff;font-weight:600;font-size:7.5pt;padding:6px 8px;text-align:left}
  .paper table.bs-items thead th.num{text-align:right}
  .paper table.bs-items tbody td{padding:6px 8px;border-bottom:1px solid #cfe5f6;vertical-align:top}
  .paper table.bs-items td.num{text-align:right;white-space:nowrap}
  .paper .it-name{font-weight:600}.paper .it-desc{color:#6b6b6e;font-size:7pt;line-height:1.4}
  .paper table.bs-tot{width:100%;border-collapse:collapse;font-size:8pt}
  .paper table.bs-tot td{padding:4px 8px;border:0}
  .paper table.bs-tot td.lbl{color:#6b6b6e;text-align:right}
  .paper table.bs-tot td.val{text-align:right;white-space:nowrap;font-weight:600}
  .paper .bs-sec-lbl{font-size:7pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
  .paper .bs-sign-box{display:block;text-align:center;border-top:1.5px solid #1A1E2A;padding-top:4px;font-size:8.5pt;font-weight:600}
  .ph-banner{width:100%;height:30mm;display:flex;align-items:center;justify-content:center;color:#ffffffcc;font-size:9pt;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="dot">B</span> BrandPDF <small>Builder</small></div>
    <input class="fmt-name" id="fmtName" value="Quotation - Custom">
    <div class="spacer"></div>
    <div class="zoom"><button onclick="zoom(-.1)">−</button><span id="zoomv">80%</span><button onclick="zoom(.1)">+</button></div>
    <button class="btn ghost" onclick="exportJSON()">⇩ Export</button>
    <button class="btn primary" onclick="save()">✓ Save</button>
  </div>
  <div class="body">
    <div class="rail"><h4>Insert</h4><div id="palette"></div>
      <div class="hint">Click to add a block. <b>Drag</b> it anywhere on the page. Select it, then drag the blue handles to <b>resize</b>, or set exact X/Y/W/H on the right.</div></div>
    <div class="stage" id="stage"><div class="paperwrap" id="paperwrap"><div class="paper" id="paper"></div></div></div>
    <div class="rail right">
      <div class="tabs"><div class="tab on" data-tab="block" onclick="setTab('block')">Block</div><div class="tab" data-tab="page" onclick="setTab('page')">Page</div><div class="tab" data-tab="brand" onclick="setTab('brand')">Branding</div></div>
      <div class="props" id="propsBlock"></div>
      <div class="props" id="propsPage" style="display:none"></div>
      <div class="props" id="propsBrand" style="display:none"></div>
    </div>
  </div>
</div>
<script>
const PXMM=96/25.4;
const SAMPLE={name:"SAL-QTN-2026-00006",transaction_date:"25-06-2026",valid_till:"25-07-2026",customer_name:"Hasan Najem",company:"BSTC W.L.L",
  address_display:"Seef 436, Road 3620, Building 925<br>SR360 Tower, Office 112, Bahrain",total:"BHD 1,685.000",grand_total:"BHD 1,853.500",
  items:[{n:"CCTV",q:"1 Service",r:"BHD 0.000",a:"BHD 0.000"},{n:"HIKVISION 6 MP ColorVu 3.0 Fixed Bullet Network Camera",q:"38 Pcs",r:"BHD 27.500",a:"BHD 1,045.000",d:"High quality imaging, 8 MP"},{n:"HIKVISION 64-ch 2U 4K AcuSense NVR",q:"2 Pcs",r:"BHD 322.500",a:"BHD 645.000"}],
  taxes:[{desc:"VAT 10%",amt:"BHD 168.500"}],
  payment_schedule:[{t:"Advance",due:"25-06-2026",pct:"50.0",amt:"BHD 926.750"},{t:"On Delivery",due:"25-07-2026",pct:"50.0",amt:"BHD 926.750"}],
  terms:"Prices valid for 30 days. Payment due Net 30. Warranty per manufacturer terms."};
const FIELDS=[{f:"name",l:"Quotation No",v:SAMPLE.name},{f:"customer_name",l:"Customer Name",v:SAMPLE.customer_name},{f:"transaction_date",l:"Date",v:SAMPLE.transaction_date},{f:"valid_till",l:"Valid Till",v:SAMPLE.valid_till},{f:"grand_total",l:"Grand Total",v:SAMPLE.grand_total},{f:"total",l:"Subtotal",v:SAMPLE.total},{f:"company",l:"Company",v:SAMPLE.company}];
let DOCFIELDS=FIELDS.slice();  // replaced with the real doctype field list when embedded in ERPNext
function fieldVal(f){const x=DOCFIELDS.find(z=>z.f===f);if(!x)return "«"+f+"»";return x.v!==undefined?x.v:("«"+x.l+"»");}
const ICONS={heading:'<path d="M6 4v16M18 4v16M6 12h12"/>',text:'<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/>',field:'<rect x="3" y="8" width="18" height="8" rx="2"/><line x1="7" y1="12" x2="11" y2="12"/>',image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 17l-5-5-4 4-2-2-4 4"/>',divider:'<line x1="4" y1="12" x2="20" y2="12"/>',box:'<rect x="4" y="5" width="16" height="14" rx="2"/>',table:'<rect x="3" y="4" width="18" height="16" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="20"/>',header_banner:'<rect x="3" y="5" width="18" height="6" rx="1"/><line x1="3" y1="15" x2="14" y2="15"/>',footer_banner:'<line x1="10" y1="5" x2="21" y2="5"/><rect x="3" y="13" width="18" height="6" rx="1"/>',customer:'<circle cx="12" cy="8" r="3"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/>',items:'<rect x="3" y="4" width="18" height="16" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="20"/>',totals:'<line x1="13" y1="6" x2="20" y2="6"/><rect x="13" y="15" width="7" height="4" rx="1"/><path d="M4 6h6l-6 7h6"/>',payment_schedule:'<rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/>',terms:'<line x1="5" y1="6" x2="19" y2="6"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="5" y1="14" x2="15" y2="14"/>',signature:'<path d="M4 17c4 0 5-9 8-9s2 6 4 6 2-3 4-3"/><line x1="3" y1="21" x2="21" y2="21"/>',pagenum:'<path d="M9 4v16M15 4v16M4 9h16M4 15h16"/>',title:'<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="13" y2="12"/>'};
const META={heading:{l:"Heading"},text:{l:"Text"},field:{l:"Field"},image:{l:"Image"},divider:{l:"Line"},box:{l:"Box"},table:{l:"Table"},pagenum:{l:"Page No"},header_banner:{l:"Header"},customer:{l:"Customer"},items:{l:"Items"},totals:{l:"Totals"},payment_schedule:{l:"Payment"},terms:{l:"Terms"},signature:{l:"Signature"},footer_banner:{l:"Footer"},title:{l:"Title"}};
const ELEM=["heading","text","field","image","divider","box","table","pagenum"];
const BLOCKS=["header_banner","title","customer","items","totals","payment_schedule","terms","signature","footer_banner"];
function base(){return{align:"",size:"",weight:"",italic:false,color:"",bg:"",pad:"",border:{on:false,w:1,color:"#cfe5f6",style:"solid",radius:0}};}
const DSET={header_banner:()=>({}),footer_banner:()=>({}),title:()=>({text:"QUOTATION",showArabic:true,arabic:"عرض سعر",meta:{name:true,date:true,valid_till:true},align:"split"}),customer:()=>({heading:"Quotation To"}),items:()=>({cols:{desc:true,qty:true,rate:true,amount:true},zebra:true,headerColor:"primary"}),totals:()=>({grandColor:"primary"}),payment_schedule:()=>({}),terms:()=>({heading:"Terms & Conditions"}),signature:()=>({label:"Authorized Signature"}),heading:()=>({text:"Section heading",level:"h2"}),text:()=>({text:"Add your text here."}),field:()=>({field:"customer_name",prefix:""}),image:()=>({src:"",width:100}),divider:()=>({thickness:1,color:"#cfe5f6",lstyle:"solid"}),box:()=>({html:"<b>Note</b><br>Bank: BSTC W.L.L &middot; IBAN BH00 XXXX"}),table:()=>({cols:["Specification","Value"],rows:[["Warranty","1 Year"],["Lead time","2 weeks"]],headerBg:"primary"}),pagenum:()=>({format:"Page {p} of {n}"})};
function dstyle(t){const s=base();if(t==="heading"){s.size=15;s.weight="700";}if(t==="text"||t==="field")s.size=9;if(t==="pagenum"){s.size=8;s.align="center";}if(t==="box"){s.pad=3;s.bg="#f4f8fc";s.size=8;s.border={on:true,w:1,color:"#cfe5f6",style:"solid",radius:6};}return s;}
let idc=1;function mk(t,pos){return{id:"b"+(idc++),type:t,settings:DSET[t](),style:dstyle(t),pos:pos};}
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

const R={
  header_banner:(s,b)=>b.header_image?`<img class="bs-banner" src="${esc(b.header_image)}">`:`<div class="ph-banner" style="background:${b.primary}">Header banner</div>`,
  footer_banner:(s,b)=>b.footer_image?`<img class="bs-banner" src="${esc(b.footer_image)}">`:`<div class="ph-banner" style="background:${b.navy}">Footer banner</div>`,
  title:(s,b)=>{const m=[];if(s.meta.name)m.push(["Quotation No",SAMPLE.name]);if(s.meta.date)m.push(["Date",SAMPLE.transaction_date]);if(s.meta.valid_till)m.push(["Valid Till",SAMPLE.valid_till]);const rows=m.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");const left=`<div class="bs-title" style="color:${b.navy}">${esc(s.text)}</div>`+(s.showArabic?`<div class="bs-title-ar" style="color:${b.primary}">${esc(s.arabic)}</div>`:"");if(s.align==="center")return `<div style="text-align:center">${left}</div>`;return `<table class="bs-head"><tr><td style="text-align:left">${left}</td><td style="text-align:right"><table class="bs-meta">${rows}</table></td></tr></table>`;},
  customer:(s,b)=>`<div class="bs-billto"><div class="lbl" style="color:${b.primary}">${esc(s.heading)}</div><div class="name">${esc(SAMPLE.customer_name)}</div><div class="addr">${SAMPLE.address_display}</div></div>`,
  items:(s,b)=>{const cols=[["#","num"],["Item &amp; Description",""]];if(s.cols.qty)cols.push(["Qty","num"]);if(s.cols.rate)cols.push(["Rate","num"]);if(s.cols.amount)cols.push(["Amount","num"]);const hc=s.headerColor==="navy"?b.navy:b.primary;const th=cols.map(c=>`<th class="${c[1]}" style="background:${hc}">${c[0]}</th>`).join("");const rows=SAMPLE.items.map((it,i)=>{let t=`<td class="num">${i+1}</td><td><div class="it-name">${esc(it.n)}</div>`+(s.cols.desc&&it.d?`<div class="it-desc">${esc(it.d)}</div>`:"")+`</td>`;if(s.cols.qty)t+=`<td class="num">${esc(it.q)}</td>`;if(s.cols.rate)t+=`<td class="num">${esc(it.r)}</td>`;if(s.cols.amount)t+=`<td class="num">${esc(it.a)}</td>`;return `<tr${s.zebra&&i%2?' style="background:#eef6fc"':''}>${t}</tr>`;}).join("");return `<table class="bs-items"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`;},
  totals:(s,b)=>{const gc=s.grandColor==="navy"?b.navy:b.primary;let ln=`<tr><td class="lbl">Subtotal</td><td class="val">${esc(SAMPLE.total)}</td></tr>`;SAMPLE.taxes.forEach(t=>ln+=`<tr><td class="lbl">${esc(t.desc)}</td><td class="val">${esc(t.amt)}</td></tr>`);ln+=`<tr><td style="background:${gc};color:#fff;font-weight:700;font-size:10pt;text-align:right;padding:6px 8px">Grand Total</td><td style="background:${gc};color:#fff;font-weight:700;font-size:10pt;text-align:right;padding:6px 8px">${esc(SAMPLE.grand_total)}</td></tr>`;return `<table class="bs-tot">${ln}</table>`;},
  payment_schedule:(s,b)=>{const rows=SAMPLE.payment_schedule.map((p,i)=>`<tr${i%2?' style="background:#eef6fc"':''}><td class="num">${i+1}</td><td><div class="it-name">${esc(p.t)}</div></td><td class="num">${esc(p.due)}</td><td class="num">${esc(p.pct)}</td><td class="num">${esc(p.amt)}</td></tr>`).join("");return `<div class="bs-sec-lbl" style="color:${b.primary}">Payment Schedule</div><table class="bs-items"><thead><tr><th class="num" style="background:${b.primary}">#</th><th style="background:${b.primary}">Payment Term</th><th class="num" style="background:${b.primary}">Due Date</th><th class="num" style="background:${b.primary}">Portion %</th><th class="num" style="background:${b.primary}">Amount</th></tr></thead><tbody>${rows}</tbody></table>`;},
  terms:(s,b)=>`<div style="font-size:7.5pt;color:#6b6b6e;line-height:1.5"><div class="bs-sec-lbl" style="color:${b.primary}">${esc(s.heading)}</div>${esc(SAMPLE.terms)}</div>`,
  signature:(s,b)=>`<div class="bs-sign-box">${esc(s.label)}</div>`,
  heading:(s)=>esc(s.text),text:(s)=>esc(s.text),field:(s)=>esc((s.prefix||"")+fieldVal(s.field)),
  image:(s)=>s.src?`<img src="${esc(s.src)}" style="width:${(+s.width||100)}%">`:`<div style="border:1px dashed #b9c6e0;color:#9aa6c2;padding:14px;text-align:center;font-size:8pt">Image — set a URL</div>`,
  divider:(s)=>`<div style="border-top:${(+s.thickness||1)}px ${s.lstyle||'solid'} ${s.color||'#cfe5f6'}"></div>`,
  box:(s)=>s.html||"",
  table:(s,b)=>{const cols=s.cols||[],rows=s.rows||[];const hb=s.headerBg==="navy"?b.navy:b.primary;let h=`<table style="width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed"><thead><tr>`+cols.map((c,ci)=>`<th data-th="1" data-c="${ci}" contenteditable style="background:${hb};color:#fff;padding:5px 8px;text-align:left;border:1px solid ${hb};font-weight:600">${esc(c)}</th>`).join("")+`</tr></thead><tbody>`;h+=rows.map((r,ri)=>`<tr>`+cols.map((c,ci)=>`<td data-td="1" data-r="${ri}" data-c="${ci}" contenteditable style="padding:5px 8px;border:1px solid #cfe5f6">${esc(r[ci]||"")}</td>`).join("")+`</tr>`).join("");return h+`</tbody></table>`;},
  pagenum:(s)=>esc((s.format||"Page {p} of {n}").replace("{p}","1").replace("{n}","1"))
};

let selId=null,tab="block",scale=.8;
let state={layout:"absolute",header:{enabled:true,height:30,repeat:true},footer:{enabled:true,height:32,repeat:true},branding:{primary:"#1C75BC",navy:"#1A1E2A",font:"Montserrat",header_image:"",footer_image:""},blocks:[
  mk("header_banner",{x:0,y:0,w:210,h:null}),mk("title",{x:14,y:38,w:182,h:null}),mk("customer",{x:14,y:62,w:120,h:null}),
  mk("items",{x:14,y:90,w:182,h:null}),mk("totals",{x:104,y:172,w:92,h:null}),mk("payment_schedule",{x:14,y:200,w:182,h:null}),
  mk("terms",{x:14,y:238,w:140,h:null}),mk("footer_banner",{x:0,y:265,w:210,h:null})]};
function cur(){return state.blocks.find(x=>x.id===selId);}
function blockById(id){return state.blocks.find(b=>b.id===id);}

function styleCss(st){if(!st)return "";const p=[];if(st.align)p.push("text-align:"+st.align);if(st.size!=="")p.push("font-size:"+st.size+"pt");if(st.weight)p.push("font-weight:"+st.weight);if(st.italic)p.push("font-style:italic");if(st.color)p.push("color:"+st.color);if(st.bg)p.push("background:"+st.bg);if(st.pad!=="")p.push("padding:"+st.pad+"mm");if(st.border&&st.border.on){p.push(`border:${st.border.w}px ${st.border.style} ${st.border.color}`);if(st.border.radius)p.push("border-radius:"+st.border.radius+"px");}return p.join(";");}

function render(){
  const b=state.branding,paper=document.getElementById("paper");
  paper.style.fontFamily=`'${b.font}','Segoe UI',Arial,sans-serif`;
  let zones="";
  if(state.header.enabled)zones+=`<div style="position:absolute;left:0;top:0;width:210mm;height:${state.header.height}mm;background:#2f7bf60d;border-bottom:1px dashed #2f7bf555;pointer-events:none;z-index:0"><div style="position:absolute;top:1px;left:3px;font-size:7px;letter-spacing:1px;color:#2f7bf6dd;text-transform:uppercase">Header${state.header.repeat?' · repeats':''}</div></div>`;
  if(state.footer.enabled)zones+=`<div style="position:absolute;left:0;bottom:0;width:210mm;height:${state.footer.height}mm;background:#2f7bf60d;border-top:1px dashed #2f7bf555;pointer-events:none;z-index:0"><div style="position:absolute;top:1px;left:3px;font-size:7px;letter-spacing:1px;color:#2f7bf6dd;text-transform:uppercase">Footer${state.footer.repeat?' · repeats':''}</div></div>`;
  paper.innerHTML=zones+state.blocks.map(bl=>{
    const inner=(R[bl.type]||(()=>""))(bl.settings,b,bl);const p=bl.pos||{x:0,y:0,w:180,h:null};
    const box=`left:${p.x}mm;top:${p.y}mm;width:${p.w}mm;`+(p.h?`height:${p.h}mm;overflow:hidden;`:'');
    const sel=bl.id===selId;
    const handles=sel?'<div class="rh e" data-rh="e"></div><div class="rh s" data-rh="s"></div><div class="rh se" data-rh="se"></div>':'';
    return `<div class="blk ${sel?'sel':''}" data-id="${bl.id}" style="${box}${styleCss(bl.style)}"><span class="tag">${META[bl.type].l}</span><div class="tools"><button title="Front" onclick="toFront(event,'${bl.id}')">▲</button><button title="Delete" onclick="del(event,'${bl.id}')">🗑</button></div>${inner}${handles}</div>`;
  }).join("");
  wireTable();
}
function wireTable(){
  document.querySelectorAll('#paper [data-th]').forEach(el=>{el.addEventListener('input',()=>{blockById(el.closest('.blk').dataset.id).settings.cols[+el.dataset.c]=el.textContent;});});
  document.querySelectorAll('#paper [data-td]').forEach(el=>{el.addEventListener('input',()=>{blockById(el.closest('.blk').dataset.id).settings.rows[+el.dataset.r][+el.dataset.c]=el.textContent;});});
}

/* drag + resize on the canvas, with smart alignment guides + snapping */
const SNAP=2; // mm snap threshold
let drag=null;
function buildTargets(ex){const vx=[0,105,210],hy=[0,148.5,297];state.blocks.forEach(b=>{if(b.id===ex)return;const el=document.querySelector('.blk[data-id="'+b.id+'"]');const p=b.pos;const bh=p.h||(el?el.offsetHeight/PXMM:20);vx.push(p.x,p.x+p.w/2,p.x+p.w);hy.push(p.y,p.y+bh/2,p.y+bh);});return{vx:vx,hy:hy};}
function snapAxis(edges,targets){let best=null;edges.forEach(e=>{targets.forEach(t=>{const d=t-e;if(Math.abs(d)<=SNAP&&(best===null||Math.abs(d)<Math.abs(best.d)))best={d:d,g:t};});});return best;}
function ensureGuides(){let g=document.getElementById('guides');if(!g){g=document.createElement('div');g.id='guides';g.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:60';document.getElementById('paper').appendChild(g);}return g;}
function drawGuides(gx,gy){const g=ensureGuides();let h='';gx.forEach(x=>h+=`<div style="position:absolute;left:${x}mm;top:0;width:0;height:100%;border-left:1px solid #ff3b81"></div>`);gy.forEach(y=>h+=`<div style="position:absolute;top:${y}mm;left:0;height:0;width:100%;border-top:1px solid #ff3b81"></div>`);g.innerHTML=h;}
function clearGuides(){const g=document.getElementById('guides');if(g)g.innerHTML='';}
document.getElementById("paper").addEventListener("mousedown",function(e){
  const blk=e.target.closest(".blk");if(!blk)return;
  if(e.target.closest(".tools"))return;
  if(e.target.isContentEditable){if(blk.dataset.id!==selId)select(blk.dataset.id);return;}
  const rh=e.target.closest(".rh");
  e.preventDefault();
  if(blk.dataset.id!==selId)select(blk.dataset.id);
  const b=blockById(blk.dataset.id);if(!b)return;
  drag={id:b.id,mode:rh?rh.dataset.rh:"move",sx:e.clientX,sy:e.clientY,o:Object.assign({},b.pos),t:buildTargets(b.id)};
});
document.addEventListener("mousemove",function(e){
  if(!drag)return;
  const dx=(e.clientX-drag.sx)/(scale*PXMM),dy=(e.clientY-drag.sy)/(scale*PXMM);
  const el=document.querySelector('.blk[data-id="'+drag.id+'"]');const b=blockById(drag.id);if(!el||!b)return;
  const ch=drag.o.h||(el.offsetHeight/PXMM);let gx=[],gy=[];
  if(drag.mode==="move"){
    let nx=Math.max(0,drag.o.x+dx),ny=Math.max(0,drag.o.y+dy),w=b.pos.w;
    const sx=snapAxis([nx,nx+w/2,nx+w],drag.t.vx);if(sx){nx+=sx.d;gx.push(sx.g);}else nx=Math.round(nx);
    const sy=snapAxis([ny,ny+ch/2,ny+ch],drag.t.hy);if(sy){ny+=sy.d;gy.push(sy.g);}else ny=Math.round(ny);
    el.style.left=nx+"mm";el.style.top=ny+"mm";drag.pend={x:nx,y:ny,w:b.pos.w,h:b.pos.h};
  }else if(drag.mode==="e"){
    let nw=Math.max(10,drag.o.w+dx);const s=snapAxis([b.pos.x+nw],drag.t.vx);if(s){nw+=s.d;gx.push(s.g);}else nw=Math.round(nw);
    el.style.width=nw+"mm";drag.pend={x:b.pos.x,y:b.pos.y,w:nw,h:b.pos.h};
  }else if(drag.mode==="s"){
    let nh=Math.max(6,ch+dy);const s=snapAxis([b.pos.y+nh],drag.t.hy);if(s){nh+=s.d;gy.push(s.g);}else nh=Math.round(nh);
    el.style.height=nh+"mm";el.style.overflow="hidden";drag.pend={x:b.pos.x,y:b.pos.y,w:b.pos.w,h:nh};
  }else if(drag.mode==="se"){
    let nw=Math.max(10,drag.o.w+dx),nh=Math.max(6,ch+dy);
    const sR=snapAxis([b.pos.x+nw],drag.t.vx);if(sR){nw+=sR.d;gx.push(sR.g);}else nw=Math.round(nw);
    const sB=snapAxis([b.pos.y+nh],drag.t.hy);if(sB){nh+=sB.d;gy.push(sB.g);}else nh=Math.round(nh);
    el.style.width=nw+"mm";el.style.height=nh+"mm";el.style.overflow="hidden";drag.pend={x:b.pos.x,y:b.pos.y,w:nw,h:nh};
  }
  drawGuides(gx,gy);
});
document.addEventListener("mouseup",function(){if(!drag)return;const d=drag;drag=null;clearGuides();if(d.pend){const b=blockById(d.id);if(b)b.pos=d.pend;renderProps();}});
document.addEventListener("keydown",function(e){
  if(!selId)return;const tg=(e.target.tagName||"").toLowerCase();if(tg==="input"||tg==="textarea"||e.target.isContentEditable)return;
  const b=cur();if(!b)return;const st=e.shiftKey?10:1;let m=false;
  if(e.key==="ArrowLeft"){b.pos.x=Math.max(0,b.pos.x-st);m=true;}else if(e.key==="ArrowRight"){b.pos.x+=st;m=true;}else if(e.key==="ArrowUp"){b.pos.y=Math.max(0,b.pos.y-st);m=true;}else if(e.key==="ArrowDown"){b.pos.y+=st;m=true;}else if(e.key==="Delete"){del(null,b.id);e.preventDefault();return;}
  if(m){e.preventDefault();render();renderProps();}
});

function addBlock(t){let maxB=8;state.blocks.forEach(b=>{const bot=(b.pos.y||0)+(b.pos.h||22);if(bot>maxB)maxB=bot;});const nb=mk(t,{x:14,y:Math.min(maxB+4,270),w:t==="header_banner"||t==="footer_banner"?210:180,h:null});state.blocks.push(nb);selId=nb.id;render();renderProps();}
function select(id){if(id===selId){renderProps();return;}selId=id;tab="block";setTab("block",true);render();renderProps();}
function del(e,id){if(e)e.stopPropagation();state.blocks=state.blocks.filter(x=>x.id!==id);if(selId===id)selId=null;render();renderProps();}
function toFront(e,id){if(e)e.stopPropagation();const i=state.blocks.findIndex(x=>x.id===id);if(i>=0){const[m]=state.blocks.splice(i,1);state.blocks.push(m);render();}}
function buildPalette(){const groups=[["Elements",ELEM],["Document blocks",BLOCKS.filter(t=>t!=="title")]];document.getElementById("palette").innerHTML=groups.map(g=>`<div class="pgrp">${g[0]}</div><div class="prow">`+g[1].map(t=>`<div class="pblock" onclick="addBlock('${t}')" title="Add ${META[t].l}"><svg viewBox="0 0 24 24">${ICONS[t]||ICONS.text}</svg><span>${META[t].l}</span></div>`).join("")+`</div>`).join("");}

function setTab(t,silent){tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));document.getElementById("propsBlock").style.display=t==="block"?"":"none";document.getElementById("propsPage").style.display=t==="page"?"":"none";document.getElementById("propsBrand").style.display=t==="brand"?"":"none";if(!silent){if(t==="brand")renderBrand();else if(t==="page")renderPage();else renderProps();}}
function setS(k,v){const b=cur();if(!b)return;const p=k.split(".");let o=b.settings;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;render();}
function setStyle(k,v){const b=cur();if(!b)return;const p=k.split(".");let o=b.style;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;render();}
function setPos(k,v){const b=cur();if(!b)return;if(v===""){if(k==="h")b.pos.h=null;else return;}else{const n=parseFloat(v);if(isNaN(n))return;b.pos[k]=n;}render();}
function setAutoH(on){const b=cur();if(!b)return;if(on)b.pos.h=null;else{const el=document.querySelector('.blk[data-id="'+b.id+'"]');b.pos.h=el?Math.round(el.offsetHeight/PXMM):20;}render();renderProps();}
function setHeadingLevel(lv){const b=cur();b.settings.level=lv;const m={h1:[24,"800"],h2:[15,"700"],h3:[12,"700"],h4:[10,"600"]};b.style.size=m[lv][0];b.style.weight=m[lv][1];render();renderProps();}
function tx(l,k,v){return `<div class="fld"><label>${l}</label><input type="text" value="${esc(v)}" oninput="setS('${k}',this.value)"></div>`;}
function ta(l,k,v){return `<div class="fld"><label>${l}</label><textarea oninput="setS('${k}',this.value)">${esc(v)}</textarea></div>`;}
function ck(l,k,o){return `<label class="chk"><input type="checkbox" ${o?"checked":""} onchange="setS('${k}',this.checked)"> ${l}</label>`;}
function sg(l,k,v,o){return `<div class="fld"><label>${l}</label><div class="seg">`+o.map(x=>`<button class="${v===x[0]?'on':''}" onclick="setS('${k}','${x[0]}');renderProps()">${x[1]}</button>`).join("")+`</div></div>`;}

function posControls(p){const n=(l,k,v)=>`<div class="fld"><label>${l}</label><input type="text" value="${v===null||v===undefined||v===''?'':v}" oninput="setPos('${k}',this.value)"></div>`;
  return `<div class="stygrp"><div class="styhead">Position &amp; size (mm)</div><div class="row2">${n('X','x',p.x)}${n('Y','y',p.y)}</div><div class="row2">${n('Width','w',p.w)}${n('Height','h',p.h)}</div><label class="chk"><input type="checkbox" ${p.h===null?'checked':''} onchange="setAutoH(this.checked)"> Auto height (fit content)</label></div>`;}
function styleControls(st,type){const seg=(l,k,v,o)=>`<div class="fld"><label>${l}</label><div class="seg">`+o.map(x=>`<button class="${v===x[0]?'on':''}" onclick="setStyle('${k}','${x[0]}');renderProps()">${x[1]}</button>`).join("")+`</div></div>`;
  const num=(l,k,v)=>`<div class="fld"><label>${l}</label><input type="text" value="${v===undefined||v===null?'':v}" oninput="setStyle('${k}',this.value)"></div>`;
  const col=(l,k,v)=>`<div class="fld"><label>${l}</label><div class="color"><input type="color" value="${v||'#000000'}" oninput="setStyle('${k}',this.value)"><input type="text" value="${esc(v||'')}" placeholder="none" oninput="setStyle('${k}',this.value)"></div></div>`;
  const ckk=(l,k,o)=>`<label class="chk"><input type="checkbox" ${o?'checked':''} onchange="setStyle('${k}',this.checked);renderProps()"> ${l}</label>`;
  let h=`<div class="styhead">Style</div>`;h+=seg("Alignment","align",st.align,[["left","Left"],["center","Center"],["right","Right"]]);
  const showFont=["heading","text","field","box","customer","terms"].includes(type);
  if(showFont){h+=`<div class="row2">${num("Font size (pt)","size",st.size)}${segW(st.weight)}</div>`;h+=ckk("Italic","italic",st.italic);h+=col("Text color","color",st.color);}
  h+=col("Background","bg",st.bg);h+=num("Padding (mm)","pad",st.pad);h+=ckk("Border","border.on",st.border.on);
  if(st.border.on){h+=`<div class="row2">${num("Border width","border.w",st.border.w)}${num("Radius","border.radius",st.border.radius)}</div>`;h+=col("Border color","border.color",st.border.color);h+=seg("Border style","border.style",st.border.style,[["solid","Solid"],["dashed","Dashed"],["dotted","Dotted"]]);}
  return `<div class="stygrp">`+h+`</div>`;}
function segW(v){return `<div class="fld"><label>Weight</label><div class="seg">`+[["","Reg"],["600","Semi"],["700","Bold"],["800","Black"]].map(o=>`<button class="${v===o[0]?'on':''}" onclick="setStyle('weight','${o[0]}');renderProps()">${o[1]}</button>`).join("")+`</div></div>`;}

function renderProps(){const host=document.getElementById("propsBlock"),b=cur();
  if(!b){host.innerHTML=`<div class="noselect">Click a block on the page to edit it,<br>or insert one from the left.</div>`;return;}
  const s=b.settings,t=b.type;let h=`<div class="ptitle">${META[t].l}</div>`;
  if(t==="heading"){h+=tx("Text","text",s.text);h+=`<div class="fld"><label>Level</label><div class="seg">`+["h1","h2","h3","h4"].map(l=>`<button class="${s.level===l?'on':''}" onclick="setHeadingLevel('${l}')">${l.toUpperCase()}</button>`).join("")+`</div></div>`;}
  else if(t==="text"){h+=ta("Text","text",s.text);}
  else if(t==="field"){h+=`<div class="fld"><label>Document field (${DOCFIELDS.length})</label><select onchange="setS('field',this.value)">`+DOCFIELDS.map(f=>`<option value="${f.f}" ${s.field===f.f?'selected':''}>${esc(f.l)}</option>`).join("")+`</select></div>`+tx("Prefix","prefix",s.prefix);}
  else if(t==="image"){h+=tx("Image URL (/files/...)","src",s.src);h+=tx("Width inside box (%)","width",s.width);}
  else if(t==="divider"){h+=tx("Thickness (px)","thickness",s.thickness);h+=`<div class="fld"><label>Color</label><div class="color"><input type="color" value="${s.color}" oninput="setS('color',this.value)"><input type="text" value="${esc(s.color)}" oninput="setS('color',this.value)"></div></div>`+sg("Style","lstyle",s.lstyle,[["solid","Solid"],["dashed","Dashed"],["dotted","Dotted"]]);}
  else if(t==="box"){h+=ta("Content (HTML allowed)","html",s.html);}
  else if(t==="pagenum"){h+=tx("Format ({p}=page, {n}=total)","format",s.format);}
  else if(t==="table"){h+=sg("Header color","headerBg",s.headerBg,[["primary","Primary"],["navy","Navy"]]);h+=`<div class="fld"><label>Rows &amp; columns</label><div class="tablebtns"><button onclick="addRow()">+ Row</button><button onclick="addCol()">+ Column</button><button onclick="delRow()">− Row</button><button onclick="delCol()">− Column</button></div></div><div class="hint" style="padding:6px 0 0">Click a cell on the page to edit it.</div>`;}
  else if(t==="title"){h+=tx("Title text","text",s.text);h+=ck("Show Arabic subtitle","showArabic",s.showArabic);if(s.showArabic)h+=tx("Arabic","arabic",s.arabic);h+=sg("Layout","align",s.align,[["split","Title + Info"],["center","Centered"]]);h+=`<div class="fld"><label>Info box fields</label>`+ck("Quotation No","meta.name",s.meta.name)+ck("Date","meta.date",s.meta.date)+ck("Valid Till","meta.valid_till",s.meta.valid_till)+`</div>`;}
  else if(t==="customer"){h+=tx("Heading","heading",s.heading);}
  else if(t==="items"){h+=`<div class="fld"><label>Columns</label>`+ck("Description","cols.desc",s.cols.desc)+ck("Qty","cols.qty",s.cols.qty)+ck("Rate","cols.rate",s.cols.rate)+ck("Amount","cols.amount",s.cols.amount)+`</div>`+ck("Zebra rows","zebra",s.zebra)+sg("Header color","headerColor",s.headerColor,[["primary","Primary"],["navy","Navy"]]);}
  else if(t==="totals"){h+=sg("Grand-total color","grandColor",s.grandColor,[["primary","Primary"],["navy","Navy"]]);}
  else if(t==="terms"){h+=tx("Heading","heading",s.heading);}
  else if(t==="signature"){h+=tx("Label","label",s.label);}
  else if(t==="header_banner"||t==="footer_banner"){h+=`<div class="noselect" style="padding:14px 0">Uses the banner image from the Branding tab.</div>`;}
  h+=posControls(b.pos);
  if(t!=="header_banner"&&t!=="footer_banner")h+=styleControls(b.style,t);
  h+=`<button class="delblk" onclick="del(null,'${b.id}')">Delete this block</button>`;
  host.innerHTML=h;}
function addCol(){const b=cur();b.settings.cols.push("Column");b.settings.rows.forEach(r=>r.push(""));render();}
function addRow(){const b=cur();b.settings.rows.push(b.settings.cols.map(()=>""));render();}
function delCol(){const b=cur();if(b.settings.cols.length<=1)return;b.settings.cols.pop();b.settings.rows.forEach(r=>r.pop());render();}
function delRow(){const b=cur();if(!b.settings.rows.length)return;b.settings.rows.pop();render();}
function setHF(z,k,v){if(k==="height"){const n=parseFloat(v);if(isNaN(n))return;state[z].height=n;}else state[z][k]=v;render();}
function renderPage(){const mk=(name,key,z)=>`<div class="styhead">${name}</div><label class="chk"><input type="checkbox" ${z.enabled?'checked':''} onchange="setHF('${key}','enabled',this.checked);renderPage()"> Show ${name.toLowerCase()}</label>`+(z.enabled?`<div class="fld"><label>${name} height (mm)</label><input type="text" value="${z.height}" oninput="setHF('${key}','height',this.value)"></div><label class="chk"><input type="checkbox" ${z.repeat?'checked':''} onchange="setHF('${key}','repeat',this.checked)"> Repeat on every page</label>`:"");
  document.getElementById("propsPage").innerHTML=`<div class="ptitle">Page header &amp; footer</div>`+mk("Header","header",state.header)+`<div style="height:12px"></div>`+mk("Footer","footer",state.footer)+`<div class="hint" style="padding:12px 0 0">Drop a logo, text, or a <b>Page No</b> element into the shaded band on the page. With “Repeat on every page” on, they print on every page (with real page numbers) after you deploy.</div>`;}
function setB(k,v){state.branding[k]=v;render();}
function renderBrand(){const b=state.branding;document.getElementById("propsBrand").innerHTML=`<div class="ptitle">Branding</div><div class="fld"><label>Primary color</label><div class="color"><input type="color" value="${b.primary}" oninput="setB('primary',this.value)"><input type="text" value="${esc(b.primary)}" oninput="setB('primary',this.value)"></div></div><div class="fld"><label>Secondary / navy</label><div class="color"><input type="color" value="${b.navy}" oninput="setB('navy',this.value)"><input type="text" value="${esc(b.navy)}" oninput="setB('navy',this.value)"></div></div><div class="fld"><label>Font</label><select onchange="setB('font',this.value)">`+["Montserrat","Cairo","Arial","Tahoma"].map(f=>`<option ${b.font===f?'selected':''}>${f}</option>`).join("")+`</select></div><div class="fld"><label>Header image URL</label><input type="text" value="${esc(b.header_image)}" oninput="setB('header_image',this.value)"></div><div class="fld"><label>Footer image URL</label><input type="text" value="${esc(b.footer_image)}" oninput="setB('footer_image',this.value)"></div>`;}

function zoom(d){scale=Math.min(1.6,Math.max(.35,scale+d));document.getElementById("paperwrap").style.transform=`scale(${scale})`;document.getElementById("zoomv").textContent=Math.round(scale*100)+"%";}
function definition(){return{name:document.getElementById("fmtName").value,layout:"absolute",header:state.header,footer:state.footer,branding:state.branding,blocks:state.blocks.map(b=>({type:b.type,settings:b.settings,style:b.style,pos:b.pos}))};}
function exportJSON(){const blob=new Blob([JSON.stringify(definition(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(document.getElementById("fmtName").value||"format")+".json";a.click();}
const EMBED=(window.parent&&window.parent!==window);
function save(){const def=definition();if(EMBED){window.parent.postMessage({type:"brandpdf-save",definition:def},window.location.origin);flashSaved();return;}if(window.frappe&&frappe.call){frappe.call({method:"brandpdf.api.save_format",args:{definition:JSON.stringify(def)},callback:()=>frappe.show_alert({message:"Format saved",indicator:"green"})});return;}console.log("DEFINITION",def);alert("Saved (demo) - logged to console.");}
function flashSaved(){const b=document.querySelector(".btn.primary");if(!b)return;const t=b.textContent;b.textContent="✓ Saved";setTimeout(function(){b.textContent=t;},1400);}
function loadDefinition(def){try{if(def.branding)state.branding=Object.assign({primary:"#1C75BC",navy:"#1A1E2A",font:"Montserrat",header_image:"",footer_image:""},def.branding);
  if(def.header)state.header=Object.assign({enabled:true,height:30,repeat:true},def.header);if(def.footer)state.footer=Object.assign({enabled:true,height:32,repeat:true},def.footer);
  if(Array.isArray(def.blocks))state.blocks=def.blocks.map(function(b,i){return{id:"b"+(idc++),type:b.type,settings:b.settings||(DSET[b.type]?DSET[b.type]():{}),style:b.style||dstyle(b.type),pos:b.pos||{x:14,y:8+i*16,w:180,h:null}};});
  if(def.name)document.getElementById("fmtName").value=def.name;selId=null;render();renderProps();renderBrand();}catch(e){console.error("BrandPDF load failed",e);}}
window.addEventListener("message",function(e){if(e.origin!==window.location.origin)return;const d=e.data||{};if(d.type==="brandpdf-load"&&d.definition)loadDefinition(d.definition);if(d.type==="brandpdf-fields"&&Array.isArray(d.fields)){DOCFIELDS=d.fields.map(function(x){return{f:x.fieldname,l:x.label};});render();if(cur()&&cur().type==="field")renderProps();}if(d.type==="brandpdf-saved")flashSaved();});

buildPalette();render();renderProps();renderBrand();zoom(0);
</script>
</body>
</html>
