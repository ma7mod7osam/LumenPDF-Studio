[project]
name = "lumenpdf"
authors = [
    { name = "BSTC", email = "support@bstc-bh.com" },
]
description = "LumenPDF Studio — a visual print-format builder for Frappe/ERPNext: pixel-perfect branded PDFs for documents and reports, with ready-made templates."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
# No hard dependencies: the default engine (frappe_chrome) reuses the host's own PDF pipeline,
# and the wkhtmltopdf landscape fallback uses pdfkit/pypdf, which frappe itself ships.
dependencies = []

[project.optional-dependencies]
# Alternative engines, opt-in via site_config "lumenpdf_engine".
playwright = ["playwright>=1.40.0"]
gotenberg = ["requests>=2.28.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "lumenpdf"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<16.0.0"
